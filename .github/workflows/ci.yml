name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Unit tests + Snakemake DAG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up micromamba environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: workflow/envs/py_stats.yaml
          environment-name: ibdmb-py_stats
          cache-environment: true
          init-shell: bash
          post-cleanup: 'all'
      - name: Install CI-only tooling
        shell: bash -el {0}
        run: micromamba install -n ibdmb-py_stats -c conda-forge pytest snakemake=8.30.0
      - name: Run unit tests
        shell: bash -el {0}
        run: make unit
      - name: Validate complete DAG
        shell: bash -el {0}
        run: make dryrun CORES=2

  real-data-smoke:
    name: Real 16S FASTQ + Cutadapt smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Cutadapt
        run: python -m pip install --upgrade pip cutadapt
      - name: Download real ZymoBIOMICS 16S test reads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_real_data
          base='https://raw.githubusercontent.com/nf-core/test-datasets/ampliseq/testdata'
          curl -fL --retry 3 "${base}/1_S103_L001_R1_001.fastq.gz" -o ci_real_data/sample_R1.fastq.gz
          curl -fL --retry 3 "${base}/1_S103_L001_R2_001.fastq.gz" -o ci_real_data/sample_R2.fastq.gz
          gzip -t ci_real_data/sample_R1.fastq.gz
          gzip -t ci_real_data/sample_R2.fastq.gz
      - name: Run Cutadapt on real reads
        run: |
          set -euo pipefail
          cutadapt \
            -g 'GTGYCAGCMGCCGCGGTAA' \
            -G 'GGACTACNVGGGTWTCTAAT' \
            --discard-untrimmed \
            --minimum-length 50 \
            -o ci_real_data/trimmed_R1.fastq.gz \
            -p ci_real_data/trimmed_R2.fastq.gz \
            ci_real_data/sample_R1.fastq.gz ci_real_data/sample_R2.fastq.gz
          test -s ci_real_data/trimmed_R1.fastq.gz
          test -s ci_real_data/trimmed_R2.fastq.gz
          gzip -t ci_real_data/trimmed_R1.fastq.gz
          gzip -t ci_real_data/trimmed_R2.fastq.gz
