name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Unit tests + Snakemake DAG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up micromamba environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: workflow/envs/py_stats.yaml
          environment-name: ibdmb-py_stats
          cache-environment: true
          init-shell: bash
          post-cleanup: 'all'
      - name: Install CI-only tooling
        shell: bash -el {0}
        run: micromamba install -n ibdmb-py_stats -c conda-forge pytest snakemake=8.30.0
      - name: Run unit tests
        shell: bash -el {0}
        run: make unit
      - name: Validate complete DAG
        shell: bash -el {0}
        run: make dryrun CORES=2

  real-data-smoke:
    name: Real 16S FASTQ + Cutadapt smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Cutadapt
        run: python -m pip install --upgrade pip cutadapt
      - name: Download two small public 16S runs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_real_data
          for acc in SRR7721323 SRR7721324; do
            curl -fsSL "https://www.ebi.ac.uk/ena/portal/api/filereport?accession=${acc}&result=read_run&fields=fastq_ftp&format=tsv" \
              | tail -n +2 | cut -f2 | tr ';' '\n' | while read -r ftp; do
                  [ -z "$ftp" ] && continue
                  curl -fL --retry 3 "https://${ftp}" -o "ci_real_data/$(basename "$ftp")"
                done
          done
          find ci_real_data -type f -name '*.fastq.gz' -print
      - name: Run Cutadapt on real reads
        run: |
          set -euo pipefail
          files=(ci_real_data/*.fastq.gz)
          test "${#files[@]}" -ge 2
          cutadapt \
            -g 'ACACTGACGACATGGTTCTACAGTGCCAGCMGCCGCGGTAA' \
            -G 'TACGGTAGCAGAGACTTGGTCTGGACTACHVGGGTWTCTAAT' \
            --discard-untrimmed \
            --minimum-length 50 \
            -o ci_real_data/trimmed_R1.fastq.gz \
            -p ci_real_data/trimmed_R2.fastq.gz \
            "${files[0]}" "${files[1]}"
          test -s ci_real_data/trimmed_R1.fastq.gz
          test -s ci_real_data/trimmed_R2.fastq.gz
          gzip -t ci_real_data/trimmed_R1.fastq.gz
          gzip -t ci_real_data/trimmed_R2.fastq.gz
