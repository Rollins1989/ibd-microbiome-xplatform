name: Apply longitudinal permutation fix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('workflow/scripts/ml.py')
          s = p.read_text()
          old = '''def permute_labels(y, groups, rng):
              """Shuffle labels between subjects; if labels vary within subject, shuffle whole subject label vectors' order."""
              subj = pd.unique(groups)
              lab = {s: y[groups == s] for s in subj}
              if all(len(set(v)) == 1 for v in lab.values()):
                  perm = rng.permutation([v[0] for v in lab.values()])
                  m = dict(zip(subj, perm))
                  return np.array([m[s] for s in groups])
              return rng.permutation(y)
          '''
          new = '''def permute_labels(y, groups, rng):
              """Shuffle complete subject-level label vectors without breaking within-subject structure."""
              groups = np.asarray(groups)
              y = np.asarray(y)
              subjects = pd.unique(groups)
              idx = {s: np.flatnonzero(groups == s) for s in subjects}
              labels = {s: y[idx[s]].copy() for s in subjects}
              if all(np.all(v == v[0]) for v in labels.values()):
                  shuffled = rng.permutation(subjects)
                  out = np.empty_like(y)
                  for target, source in zip(subjects, shuffled):
                      out[idx[target]] = labels[source][0]
                  return out
              out = y.copy()
              by_n = {}
              for s in subjects:
                  by_n.setdefault(len(idx[s]), []).append(s)
              for subject_group in by_n.values():
                  shuffled = rng.permutation(subject_group)
                  for target, source in zip(subject_group, shuffled):
                      out[idx[target]] = labels[source]
              return out
          '''
          if old not in s:
              raise SystemExit('expected old permutation implementation not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Verify
        run: |
          python - <<'PY'
          import importlib.util
          import numpy as np
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('ml', Path('workflow/scripts/ml.py'))
          ml = importlib.util.module_from_spec(spec); spec.loader.exec_module(ml)
          y = np.array([0,1,0,0,1,1,1,0,0]); g = np.array(['A','A','A','B','B','B','C','C','C'])
          z = ml.permute_labels(y, g, np.random.default_rng(11))
          assert sorted(tuple(y[g==x]) for x in np.unique(g)) == sorted(tuple(z[g==x]) for x in np.unique(g))
          print('subject-level longitudinal permutation check passed')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workflow/scripts/ml.py
          git commit -m 'Fix longitudinal subject-level permutation control' || exit 0
          git push
